        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision]"
          pip install pytest pytest-asyncio
          # test-only dep: test_metrics_route parses /metrics output via the
          # prometheus_client parser; production code deliberately avoids it.
          pip install prometheus-client

      - name: Verify Apple Silicon
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', 'Not ARM64'"
          python -c "import mlx.core as mx; print(f'MLX OK: {mx.default_device()}')"

