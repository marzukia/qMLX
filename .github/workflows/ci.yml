name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff lint
        run: ruff check vllm_mlx/ tests/

      - name: Run ruff format check
        run: ruff format --check vllm_mlx/ tests/

      # Structural check — catches "silent flag drop" bugs where a CLI
      # arg is defined but never plumbed to its target config (#400).
      # Pure stdlib + AST — no mlx import required, runs on Linux.
      - name: CLI ↔ Config fidelity audit
        run: python scripts/audit_cli_config_fidelity.py

      # PF-3 — supply-chain hardening. Third-party GitHub Actions must
      # pin to a 40-char commit SHA, not a mutable tag/branch. The repo
      # currently has known pre-existing violations (codecov-action,
      # peaceiris/gh-pages, pypa/gh-action-pypi-publish, peter-evans/
      # repository-dispatch) tracked for follow-up — advisory mode
      # (continue-on-error) until those are pinned in a separate
      # hardening PR. Once clean, drop continue-on-error to make this
      # a hard gate.
      - name: GitHub Actions SHA pinning (advisory)
        continue-on-error: true
        run: python scripts/check_gha_pinning.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic fastapi

      - name: Run mypy
        run: mypy vllm_mlx/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pydantic fastapi jsonschema httpx psutil transformers requests
          # CI matrix floor is 3.10; tomllib is 3.11+ (test_codex_profile.py).
          pip install "tomli; python_version < '3.11'"

