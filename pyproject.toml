[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmlx-serve"
version = "0.15.1"
description = "Disk KV restore for hybrid MoE models on Apple Silicon. A Qwen-specialised fork of qMLX that keeps a 122B model warm on a Mac."
readme = "README.md"
license = {text = "MIT AND Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Andryo Marzuki"},
    {name = "qMLX contributors"}
]
keywords = ["llm", "mlx", "apple-silicon", "inference", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core — all you need for `qmlx serve <text-model>`. Floor 0.31.2/0.31.3
    # (#720): the cross-thread Stream(gpu, N) repro still crashes, so the
    # 0.7.41 mx.default_stream shim in engine_core.py is deliberately retained.
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",  # #512: presence_penalty/frequency_penalty kwargs; 0.31.3 thread-local generation_stream, cross-thread eval still broken (shim sites).
    # mlx-vlm is opt-in via [vision] extras (saves ~322 MB for text-only users)
    # Cap <5.13: 5.13.0 tightened AutoTokenizer.register (key.__module__) while
    # mlx-lm registers tokenizers by string class name — bare `import mlx_lm`
    # raises AttributeError. Drop the cap once mlx-lm registers real classes.
    # HY3 (2026-07-09): 0.11.0 vendor drop validated against transformers 5.7.0
    # (canonical ref); floor stays 5.0.0 — the vendored HY3 tokenizer path
    # bypasses AutoTokenizer, so the transformers minor is not in the hot path.
    "transformers>=5.0.0,<5.13",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.24.0",
    # pillow is opt-in via [vision] extras — only MLLM paths touch PIL; mlx-vlm requires it.
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    # rich — Rich-grade terminal output for qmlx CLI commands (#51).
    # Pure-Python, no native deps; the CLI's plain-text fallback path
    # stays byte-identical when rich is missing (see vllm_mlx/_ui.py).
    "rich>=13.7",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.0.0",
    "jsonschema>=4.0.0",
    # argcomplete — shell tab completion for the `qmlx` CLI (PYTHON_ARGCOMPLETE_OK
    # marker in cli.py); required so `qmlx chat <TAB>` works on every install.
    # >=3.6: fixes TypeError from 3.12's 4th `intermixed` arg in argparse.
    "argcomplete>=3.6",
    # openai-harmony — official harmony-protocol streaming parser for
    # HarmonyStreamingRouter (gpt-oss tool calls, #513 / cluster #444 #455
    # #468 #480). Soft-imported; legacy state machine is the fallback.
    "openai-harmony>=0.0.8",
]

[project.optional-dependencies]
# Vision/multimodal (Gemma 4, Qwen-VL) — adds ~322 MB; required for any model
# with vision input. 0.6.3: DiffusionGemma (DLM #1347 + long-context prefill
# #1348); 0.5.0 also unlocks DFlash speculative decoding.
vision = [
    "mlx-vlm>=0.6.3",  # 0.6.3: DiffusionGemma (#1347/#1348); 0.6.1: gemma4_unified; 0.5.0: gemma4 multi-image + tool-parser fixes, DFlash hooks.
    "torch>=2.3.0",
    # PIL on vision paths (mllm.py, benchmark.py image mode); mlx-vlm requires it too.
    "pillow>=10.0.0",
]
# DFlash speculative decoding for Qwen3.5/3.6 dense 8-bit (#264) — adds ~1-4 GB
# (drafter weights), depends on mlx-vlm's spec-decode runtime. Text-only (no
# torch/cv2). Serve a DFlash-eligible alias with --speculative-config '{"method":"dflash"}'.
dflash = [
    "mlx-vlm>=0.6.3",
]
# MTP (Multi-Token Prediction) spec decode — Gemma 4 assistant path via
# --speculative-config '{"method":"mtp","model":"<path>"}'. pillow: the drafter
# loader transitively reaches PIL; no mlx-vlm re-pin (gemma4_text.py has its own ImportError hint).
mtp = [
    "pillow>=10.0.0",
]
# HF → Cloudflare R2 mirror tooling (scripts/mirror_to_r2.py) — maintainers only;
# users NEVER install [mirror] (client-side download uses stdlib urllib, no boto3).
mirror = [
    "boto3>=1.34.0",
]
# Interactive TUI (`qmlx tui`, `qmlx chat --tui`) — issue #51 phase 4.
# Opt-in: `pip install 'qmlx-serve[tui]'`. Base install keeps the CLI
# working with zero TUI deps (plain `qmlx tui` prints a one-line hint).
tui = [
    "textual>=0.50.0,<1.0",
]
# Gradio chat UI
chat = [
    "gradio>=4.0.0",
    "pytz>=2024.1",
]
# All extras — union of vision + chat, expanded directly to avoid a
# self-dependency that breaks `pip install .[all]` and editable installs.
all = [
    # vision
    "mlx-vlm>=0.6.3",
    "torch>=2.3.0",
    "pillow>=10.0.0",
    # chat
    "gradio>=4.0.0",
    "pytz>=2024.1",
    # dflash (text-only path covered by mlx-vlm above; listed for clarity)
]
# Test runtime — the minimum deps `pytest tests/` needs to collect every test.
# Kept narrow so CI/contributors can install just this set (not the dev toolbox).
# Closes #185: orchestrated runs re-install test deps from this canonical source.
test = [
    "pytest>=7.0.0",
    # REQUIRED: pytest.ini sets asyncio_mode = auto; without the plugin, async tests fail at collection.
    "pytest-asyncio>=0.21.0",
    # Parses /metrics in tests only — the route hand-rolls the exposition format (no runtime dep).
    "prometheus_client>=0.16.0",
    # L-07 vision-extra lock-in tests parse pyproject.toml; tomllib is stdlib on
    # >=3.11, so tomli is pinned only on 3.10 (the supported floor).
    'tomli>=2.0.1; python_version < "3.11"',
    # Optional-surface tests need these too, so orchestrated runs can rebuild a
    # venv that runs `pytest tests/` without hand-installed local extras.
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "mlx-vlm>=0.6.3; platform_system == 'Darwin'",
]
dev = [
    # Test runtime — must mirror the `test` extras so "install dev, run pytest"
    # keeps working.
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "prometheus_client>=0.16.0",
    'tomli>=2.0.1; python_version < "3.11"',
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "mlx-vlm>=0.6.3; platform_system == 'Darwin'",
    # Linters — NOT in the `test` extras; lint is its own CI step (ruff) run
    # from the host environment.
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
vllm = [
    "vllm>=0.4.0",
]
# Guided decoding with outlines for structured JSON output
guided = [
    "outlines[mlxlm]>=1.0.0",
]
[project.urls]
Homepage = "https://qmlx.mrzk.io"
Documentation = "https://github.com/marzukia/qMLX#readme"
Repository = "https://github.com/marzukia/qMLX"

[project.entry-points."vllm.platform_plugins"]
mlx = "vllm_mlx.plugin:mlx_platform_plugin"

[project.scripts]
qmlx = "vllm_mlx.cli:main"
qmlx-chat = "vllm_mlx.gradio_app:main"
# Deprecated pre-rename aliases — kept so existing users' scripts/muscle
# memory keep working. Prefer the qmlx* commands above.
vllm-mlx = "vllm_mlx.cli:main"
vllm-mlx-chat = "vllm_mlx.gradio_app:main"

[tool.setuptools.package-data]
vllm_mlx = [
    "aliases.json",
    "agents/profiles/*.yaml",
    # Integration tests bundled inside the package so `qmlx agents
    # <name> --test` works on pip/brew installs (the source layout keeps
    # them at tests/integrations/, mirrored here via symlinks). Without
    # this, the test runner shows a confusing path-error skip.
    "_integration_tests/*.py",
    "_integration_tests/*.sh",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_mlx*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E402",   # module-level import not at top
    "E501",   # line too long
    "E731",   # lambda assignment
    "F811",   # redefined unused
    "F841",   # unused variable
    "B004",   # unreliable callable check
    "B007",   # unused loop variable
    "B008",   # function call in default arg
    "B011",   # assert false
    "B017",   # assert raises exception
    "B905",   # zip without strict
    "N801",   # class name casing
    "N806",   # variable in function casing
    "SIM103", # needless bool
    "SIM108", # ternary instead of if-else
    "SIM110", # reimplemented builtin
    "SIM222", # expr or true
    "UP028",  # yield in for loop
    "SIM102", # collapsible if
    "SIM105", # suppressible exception
    "SIM115", # open file with context handler
    "B904",   # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
# Pytest parametrize convention: the Pydantic *class* is passed as
# ``Model`` so the test body reads naturally (``Model(model="x", ...)``);
# renaming would lose readability across many tests.
"tests/test_param_validation_r5e.py" = ["N803"]
"tests/test_param_validation_r7b.py" = ["N803"]
# Chain-of-K MTP uses ``K`` as chain length (Ollama speculate.go, Google
# mlx-vlm draft_block); N803 lowercase rule incompatible with the
# speculative-decode literature convention.
"vllm_mlx/spec_decode/mtp/generator.py" = ["N803"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
